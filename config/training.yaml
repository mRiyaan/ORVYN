training:
  algorithm: "XGBoost"
  primary_model: "models/downstream/model_a_embeddings_only.json"
  primary_experiment: "Experiment A (NormWear Embeddings 768-D)"
  feature_dim: 768
  random_seed: 42
  metrics:
    - "accuracy"
    - "balanced_accuracy"
    - "f1_score"
    - "roc_auc"
  hyperparameters:
    max_depth: 6
    learning_rate: 0.1
    n_estimators: 100
    objective: "binary:logistic"
    eval_metric: "logloss"
